<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LincolnX | Game Installer Platform</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<style>
  :root {
    --neon-blue: #00d4ff;
    --neon-purple: #9b5cff;
    --neon-green: #00ff9d;
    --bg-dark: #0a0a12;
    --bg-card: #12121f;
    --text: #e8e8f0;
    --text-dim: #8a8aa0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--bg-dark);
    color: var(--text);
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(0, 212, 255, 0.10), transparent 50%),
      radial-gradient(circle at 80% 30%, rgba(155, 92, 255, 0.10), transparent 50%),
      radial-gradient(circle at 50% 90%, rgba(0, 255, 157, 0.06), transparent 50%);
    display: flex;
    flex-direction: column;
  }

  .top-nav {
    background: rgba(18, 18, 31, 0.9);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .top-nav .brand {
    font-size: 24px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-decoration: none;
  }

  .top-nav .nav-links {
    display: flex;
    gap: 16px;
    align-items: center;
  }

  .nav-btn {
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    text-decoration: none;
    cursor: pointer;
    border: none;
    transition: all 0.3s;
  }

  .nav-btn.login { background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple)); }
  .nav-btn.login:hover { box-shadow: 0 8px 25px rgba(0,212,255,0.3); transform: translateY(-1px); }
  .nav-btn.admin { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: var(--text-dim); }
  .nav-btn.admin:hover { border-color: var(--neon-blue); color: var(--neon-blue); }

  .hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px 24px;
  }

  .hero .icon { font-size: 80px; animation: float 3s ease infinite; }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  .hero h1 {
    font-size: 56px;
    margin-top: 20px;
    background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple), var(--neon-green));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero p {
    color: var(--text-dim);
    font-size: 18px;
    margin-top: 12px;
    max-width: 500px;
  }

  .hero-btns {
    display: flex;
    gap: 16px;
    margin-top: 36px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .hero-btn {
    padding: 16px 40px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 800;
    color: #fff;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.3s;
    border: none;
  }

  .hero-btn.primary { background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple)); }
  .hero-btn.primary:hover { box-shadow: 0 12px 35px rgba(0,212,255,0.4); transform: translateY(-3px); }

  .hero-btn.secondary {
    background: transparent;
    border: 1px solid rgba(0,255,157,0.4);
    color: var(--neon-green);
  }
  .hero-btn.secondary:hover { box-shadow: 0 12px 35px rgba(0,255,157,0.2); transform: translateY(-3px); }

  .footer {
    text-align: center;
    padding: 20px;
    color: var(--text-dim);
    font-size: 13px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  @media (max-width: 600px) {
    .hero h1 { font-size: 36px; }
    .top-nav { flex-direction: column; gap: 12px; }
    .hero-btns { flex-direction: column; width: 100%; }
    .hero-btn { width: 100%; text-align: center; }
  }
</style>
</head>
<body>
<nav class="top-nav">
  <a href="#" class="brand">🎮 LINCOLN<span style="background:linear-gradient(135deg,#00ff9d,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">X</span></a>
  <div class="nav-links">
    <a href="login.html" class="nav-btn login">🔐 LOGIN</a>
    <a href="admin/admin.html" class="nav-btn admin">⚙️ ADMIN</a>
  </div>
</nav>

<div class="hero">
  <div class="icon">🎮</div>
  <h1>LINCOLN<span style="background:linear-gradient(135deg,#00ff9d,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">X</span></h1>
  <p>Direct link PC & Emulator games pre-installed for you. Enter your license key to access the library.</p>
  <div class="hero-btns">
    <a href="login.html" class="hero-btn primary">🔓 UNLOCK GAME LIBRARY</a>
    <a href="installer.html" class="hero-btn secondary">📥 INSTALLER</a>
  </div>
</div>

<div class="footer">© 2026 LincolnX. All rights reserved.</div>

<script src="sw.js"></script>
</body>
</html>
