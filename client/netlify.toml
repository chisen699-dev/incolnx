# =============================================
# LINCOLNX NETLIFY CONFIGURATION (DEV FALLBACK)
# =============================================
# NOTE: This file exists so that if Netlify build settings
# are configured with Base directory = "client", functions
# from the root "functions/" folder are still included.
#
# RECOMMENDED SETUP (use root-level netlify.toml):
#   - Base directory: [LEAVE EMPTY]
#   - Build command:  node scripts/copy-admin.js
#   - Publish directory: client
# =============================================

[build]
  publish = "."
  functions = "../functions"
  command = "cd ../functions && npm install && node ../scripts/copy-admin.js"

[build.environment]
  NODE_VERSION = "18"

# Redirects - admin panel and SPA fallback
[[redirects]]
  from = "/admin"
  to = "/admin/admin.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/admin.html"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "no-cache"

# Don't cache API function responses
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"